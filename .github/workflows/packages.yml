name: Player packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/bootstrap.py
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py --output dist/player-package
      - uses: actions/upload-artifact@v6
        if: failure() && runner.os == 'Linux'
        with:
          name: NarciBloom-${{ matrix.os }}-diagnostics
          path: dist/player-package/frozen/NarciBloom/licenses/native-runtime-report.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: NarciBloom-${{ matrix.os }}
          path: |
            dist/player-package/*.zip
            dist/player-package/SHA256SUMS.txt
            dist/player-package/artifacts.json
